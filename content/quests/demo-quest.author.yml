questId: demo_cell
version: 1.0.0
title: Пробуждение в камере
start: intro

vars:
  resolve: 0

flags:
  hasKey: false

scenes:
  intro:
    textPools:
      cell_flavor:
        - В углу пахнет плесенью и мокрой соломой.
        - Где-то за стеной капает вода, мерно отбивая время.
        - Вы слышите приглушённые голоса, но слов не разобрать.
    text:
      - Вы приходите в себя в сырой камере.
      - "{{pool:cell_flavor}}"
      - "Ваш уровень решимости: {{resolve}}."
      - Под дверью виден тонкий луч света.
    choices:
      - id: search_straw
        text: Осмотреть солому
        do: hasKey = true
        goto: corridor_decision
      - id: call_guard
        text: Позвать стражника
        do: resolve += 1
        goto: corridor_decision

  corridor_decision:
    type: decision
    text: "Шаги в коридоре затихают, и у вас появляется шанс действовать.
      У вас [if hasKey]есть ключ[endif][if !hasKey]нет ключа[endif]."
    choices:
      - id: unlock_door
        text: Попробовать открыть дверь ключом
        when: hasKey
        goto: outcome_branch
      - id: force_door
        text: Навалиться на дверь плечом
        when: resolve >= 1
        goto: outcome_branch
      - id: wait
        text: Остаться и ждать
        goto: captured

  outcome_branch:
    branches:
      - when: hasKey
        goto: escape
    default: captured

  escape:
    text: "Замок поддается, и вы бесшумно исчезаете в коридоре.
      Ваш уровень решимости: {{resolve}}."
    result: victory

  captured:
    text: Шум привлекает стражу, и попытка побега заканчивается провалом.
    result: defeat
